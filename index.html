<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
    <title>Confidential Case Report</title>
    <link rel="stylesheet" href="assets/styles.css?v=lost-fund-recovery-1">
  </head>
  <body>
    <main>
      <section id="unlock" class="unlock" aria-labelledby="portal-title">
        <img class="brand-logo" src="assets/lost-fund-recovery-logo.png" alt="Lost Fund Recovery Project logo">
        <p class="eyebrow">Lost Fund Recovery Project</p>
        <h1 id="portal-title">Confidential Case Report</h1>
        <p class="intro">Enter the access code printed in your letter. No username is required.</p>
        <form id="unlock-form" novalidate>
          <label for="access-code">Access code</label>
          <div class="input-row">
            <input id="access-code" name="access-code" type="password" autocomplete="current-password" inputmode="text" spellcheck="false" autocapitalize="none" required>
            <button type="submit">Open report</button>
          </div>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p class="privacy">The code is processed in this browser and is never placed in the URL.</p>
      </section>

      <article id="report" class="report" aria-live="polite" hidden>
        <div class="report-toolbar">
          <p>Confidential supplementary material</p>
          <button id="close-report" type="button" class="secondary">Close report</button>
        </div>
        <div id="report-content" class="report-content"></div>
      </article>
    </main>
    <noscript>This encrypted report requires JavaScript for local decryption.</noscript>
    <script type="module" src="assets/app.mjs?v=lost-fund-recovery-1"></script>
  </body>
</html>
